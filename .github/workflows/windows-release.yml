name: Gerar CompraHub para Windows
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: "${{ github.workspace }}\\.browsers"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Preparar dependências e navegador
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar, compilar e verificar o executável isolado
        run: python -X utf8 build_exe.py
      - uses: actions/upload-artifact@v7
        with:
          name: CompraHub-windows-x64
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/CompraHub.exe
            dist/CompraHub-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/VERIFICACAO.json
            dist/LEIA-ME.txt
      - name: Publicar os downloads na Release da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --verify-tag --title "CompraHub $env:RELEASE_TAG" --notes-file distribution/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload "$env:RELEASE_TAG" dist/CompraHub.exe dist/CompraHub-windows-x64.zip dist/SHA256SUMS.txt dist/VERIFICACAO.json --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
